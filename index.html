<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGE - Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #334155;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      opacity: 0.5;
      background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      pointer-events: none;
    }

    .line-bg {
      opacity: 0.8;
      stroke-width: 1.5;
      transition: stroke 0.5s ease;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .animated-dot {
      offset-path: var(--path-route);
      animation: path-travel 3s linear infinite;
      position: absolute;
      border-radius: 50%;
      width: 6px;
      height: 6px;
      z-index: 5;
      filter: drop-shadow(0 0 3px currentcolor);
      transform-origin: center;
    }

    @keyframes path-travel {
      0% {
        offset-distance: 0%;
        opacity: 0;
      }

      5% {
        opacity: 1;
      }

      95% {
        opacity: 1;
      }

      100% {
        offset-distance: 100%;
        opacity: 0;
      }
    }

    @keyframes spin {
      100% {
        transform: scale(1.3) rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="bg-grid"></div>

  <div id="app"
    class="relative w-full min-h-screen z-10 flex flex-col items-center pt-8 md:pt-16 pb-24 overflow-x-hidden">
    <svg id="svg-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-0"
      style="overflow: visible;"></svg>

    <div id="logo-section" class="relative z-20 flex flex-col items-center mb-8 md:mb-16 mt-4 md:mt-8">
      <div id="logo-wrapper"
        class="border-black relative flex items-center justify-center rounded-full bg-white z-10 transition-transform cursor-pointer hover:scale-105 shadow-md w-[140px] h-[140px] md:w-[220px] md:h-[220px]"
        onclick="resetHub()">
        <div class="absolute inset-0 rounded-full border border-slate-100" style="transform: scale(1.10);"></div>
        <div class="absolute inset-0 rounded-full border border-black border-dashed"
          style="transform: scale(1.20); animation: spin 60s linear infinite;"></div>
        <img src="./LOGO/LOGO SEM FUNDO.png" alt="SGE Logo"
          class="object-contain w-[180px] h-[180px] md:w-[280px] md:h-[280px] max-w-none z-20"
          onerror="this.src='./public/logo-sge.png'">
      </div>
    </div>

    <!-- Categories Row (Flex) -->
    <div id="categories-row"
      class="relative z-20 flex flex-row items-start justify-center gap-4 md:gap-20 w-full px-2 md:px-6 mb-8 transition-all duration-500">
    </div>

    <!-- Sub Items Row -->
    <div id="sub-items-row" class="relative z-20 flex flex-col items-center gap-3 w-full px-4 min-h-[300px]">
    </div>
  </div>

  <div class="fixed bottom-4 left-0 w-full text-center pointer-events-none z-50">
    <p class="text-[9px] md:text-xs text-slate-400/80 font-mono tracking-widest uppercase">
      Desenvolvido por Warlison Abreu - Grupo GPS
    </p>
  </div>

  <script>
    const menuData = [
      {
        id: 'log', category: "LOGÍSTICA", icon: "package", color: "#d97706",
        items: [
          { name: "Almoxarifado", icon: "box", url: "almoxarifado.html" },
          { name: "Equipamentos", icon: "tool", url: "equipamentos.html" },
          { name: "Produtividade", icon: "bar-chart-2", url: "produtividade.html" },
          { name: "Controle de Frota", icon: "navigation", url: "frota.html" },
          { name: "Manutenções", icon: "settings", url: "manutencao.html" },
        ]
      },
      {
        id: 'admin', category: "ADMINISTRATIVO", icon: "users", color: "#2563eb",
        items: [
          { name: "Controle Efetivo", icon: "users", url: "efetivo.html" },
          { name: "Controle Presença", icon: "clock", url: "presenca.html" },
          { name: "Relatório Turno", icon: "file-text", url: "../Relat-rio-Turno---Oficial/index.html" },
          { name: "Horas Extras", icon: "calendar", url: "horas-extras.html" },
        ]
      },
      {
        id: 'seg', category: "SEGURANÇA", icon: "shield", color: "#059669",
        items: [
          { name: "Etilômetro Digital", icon: "activity", url: "etilometro.html" },
          { name: "Histórico Advert.", icon: "alert-triangle", url: "advertencia.html" },
          { name: "Treinamentos", icon: "award", url: "treinamentos.html" },
        ]
      }
    ];

    let activeCategory = null;
    let resizeTimer;

    function getRelCoords(el) {
      const app = document.getElementById('app');
      if (!app || !el) return null;
      const appRect = app.getBoundingClientRect();
      const rect = el.getBoundingClientRect();
      return {
        left: rect.left - appRect.left,
        top: rect.top - appRect.top,
        width: rect.width,
        height: rect.height,
        centerX: (rect.left - appRect.left) + (rect.width / 2),
        centerY: (rect.top - appRect.top) + (rect.height / 2)
      };
    }

    function createOrthogonalConnection(x1, y1, x2, y2, color, id) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const midY = y1 + (y2 - y1) / 2;
      const d = `M ${x1} ${y1} L ${x1} ${midY} L ${x2} ${midY} L ${x2} ${y2}`;
      path.setAttribute('d', d);
      path.setAttribute('stroke', color);
      path.setAttribute('fill', 'none');
      path.setAttribute('class', `line-bg conn-${id}`);
      document.getElementById('svg-layer').appendChild(path);

      const dot = document.createElement('div');
      dot.className = `animated-dot conn-${id}`;
      dot.style.backgroundColor = color;
      dot.style.setProperty('--path-route', `path('${d}')`);
      document.getElementById('app').appendChild(dot);
    }

    function createVerticalConnection(x, y1, y2, color, id) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const d = `M ${x} ${y1} L ${x} ${y2}`;
      line.setAttribute('d', d);
      line.setAttribute('stroke', color);
      line.setAttribute('fill', 'none');
      line.setAttribute('class', `line-bg conn-${id}`);
      document.getElementById('svg-layer').appendChild(line);

      const dot = document.createElement('div');
      dot.className = `animated-dot conn-${id}`;
      dot.style.backgroundColor = color;
      dot.style.width = '4px';
      dot.style.height = '4px';
      dot.style.animationDuration = '1.5s';
      dot.style.setProperty('--path-route', `path('${d}')`);
      document.getElementById('app').appendChild(dot);
    }

    function drawLines() {
      const svgLayer = document.getElementById('svg-layer');
      svgLayer.innerHTML = '';
      document.querySelectorAll('.animated-dot').forEach(el => el.remove());

      const logoNode = document.getElementById('logo-wrapper');
      const logoCoords = getRelCoords(logoNode);
      if (!logoCoords) return;

      const startX = logoCoords.centerX;
      const startY = logoCoords.centerY + (logoCoords.height / 2) * 1.30;

      menuData.forEach((cat) => {
        const col = document.getElementById(`cat-col-${cat.id}`);
        if (!col || col.style.display === 'none') return;

        const nodeEl = document.getElementById(`cat-node-${cat.id}`);
        const nodeCoords = getRelCoords(nodeEl);
        if (!nodeCoords) return;

        const endX = nodeCoords.centerX;
        const endY = nodeCoords.top - 2;

        const lineColor = (activeCategory === cat.id || activeCategory === null) ? cat.color : '#cbd5e1';
        createOrthogonalConnection(startX, startY, endX, endY, lineColor, cat.id);

        if (activeCategory === cat.id) {
          const labelEl = document.getElementById(`cat-label-${cat.id}`);
          const subRow = document.getElementById('sub-items-row');

          if (labelEl && subRow && subRow.children.length > 0) {
            const labelCoords = getRelCoords(labelEl);
            const spineStartX = labelCoords.centerX;
            const spineStartY = labelCoords.centerY + (labelCoords.height / 2) + 2;

            const lastChild = subRow.lastElementChild;
            const lastCoords = getRelCoords(lastChild);
            const spineEndY = lastCoords.centerY;
            createVerticalConnection(spineStartX, spineStartY, spineEndY, '#e2e8f0', `${cat.id}-spine`);
          }
        }
      });
    }

    function renderHub() {
      const categoriesRow = document.getElementById('categories-row');
      const subItemsRow = document.getElementById('sub-items-row');
      const svgLayer = document.getElementById('svg-layer');

      categoriesRow.innerHTML = '';
      subItemsRow.innerHTML = '';
      svgLayer.innerHTML = '';

      menuData.forEach((cat) => {
        const isActive = activeCategory === cat.id;
        const isDimmed = activeCategory !== null && !isActive;
        const isMobile = window.innerWidth < 768;

        if (isMobile && activeCategory && !isActive) {
          return;
        }

        const col = document.createElement('div');
        col.className = `flex flex-col items-center transition-all duration-500 ${isDimmed ? 'opacity-40 scale-95' : 'opacity-100 scale-100'}`;
        col.id = `cat-col-${cat.id}`;

        const node = document.createElement('div');
        node.className = `flex items-center justify-center bg-white border-2 cursor-pointer transition-all duration-300 w-16 h-16 md:w-20 md:h-20 rounded-2xl md:rounded-3xl`;
        node.id = `cat-node-${cat.id}`;

        if (isActive) {
          node.style.borderColor = cat.color;
          node.style.boxShadow = `0 4px 15px ${cat.color}60`;
          node.style.transform = 'scale(1.1)';
        } else {
          node.style.borderColor = cat.color;
          node.style.boxShadow = `0 4px 10px ${cat.color}20`;
        }

        node.innerHTML = `<i data-feather="${cat.icon}" style="color: ${cat.color};" class="w-6 h-6 md:w-8 md:h-8"></i>`;
        node.onclick = (e) => {
          e.stopPropagation();
          activeCategory = isActive ? null : cat.id;
          renderHub();
        };

        const label = document.createElement('div');
        label.className = 'mt-4 md:mt-5 whitespace-nowrap z-20';
        label.id = `cat-label-${cat.id}`;

        if (isActive) {
          label.innerHTML = `<span class="text-[9px] md:text-xs font-bold tracking-widest uppercase bg-white border px-3 py-1 md:px-4 md:py-1.5 rounded-full shadow-sm" style="color: ${cat.color}; border-color: ${cat.color}">${cat.category}</span>`;
        } else {
          label.innerHTML = `<span class="text-[8px] md:text-[10px] font-semibold tracking-widest uppercase bg-white border px-2 py-1 md:px-3 md:py-1 rounded-full shadow-sm" style="color: ${cat.color}; border-color: ${cat.color}40;">${cat.category}</span>`;
        }

        col.appendChild(node);
        col.appendChild(label);
        categoriesRow.appendChild(col);

        if (isActive) {
          cat.items.forEach((item) => {
            const row = document.createElement('div');
            row.className = 'flex items-center bg-white border border-slate-200 rounded-lg px-4 py-3 md:py-4 shadow-sm hover:border-blue-500 hover:shadow-md transition-all cursor-pointer w-64 md:w-80 relative z-20 hover:scale-[1.02]';
            row.innerHTML = `
                 <i data-feather="${item.icon}" class="w-4 h-4 md:w-5 md:h-5 text-slate-500 mr-3 md:mr-4 pointer-events-none"></i>
                 <span class="text-[11px] md:text-sm font-semibold text-slate-600 uppercase tracking-wider pointer-events-none">${item.name}</span>
             `;
            row.onclick = () => { if (item.url) window.location.href = item.url; };
            subItemsRow.appendChild(row);
          });
        }
      });

      feather.replace();

      requestAnimationFrame(() => {
        setTimeout(drawLines, 50);
      });
    }

    function resetHub() {
      activeCategory = null;
      renderHub();
    }

    window.onload = () => { renderHub(); };
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { renderHub(); drawLines(); }, 150);
    });
  </script>
</body>

</html>
